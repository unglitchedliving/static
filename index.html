
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline';
      img-src 'self' data: https:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' https://www.youtube.com https://www.youtube-nocookie.com;
      frame-src https://www.youtube-nocookie.com https://www.youtube.com;
      object-src 'none';
      base-uri 'self';
    ">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="Lightweight YouTube playlist player">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
    <title>Video Stream PWA</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./style.css">
 
</head>

<body>

  <main class="main-content" id="mainStage">
    <div class="empty-state">
      <h2>Select a Video to Start</h2>
    </div>
  </main>

  <aside class="sidebar">

    <div class="controls-wrapper">

      <select id="plFilter" aria-label="Filter playlists">
        <option value="">All Playlists</option>
      </select>

      <input
        type="search"
        id="sInput"
        placeholder="Search title..."
        aria-label="Search videos"
      >

      <div class="options-row">

        <label class="loop-label">
          <input type="checkbox" id="lToggle">
          Loop Video
        </label>

        <button class="btn-clear" id="cHistory" type="button">
          Clear History
        </button>
        <button id="editBtn" class="edit-btn">
          Edit
      </button>
      </div>
    </div>
    <div id="editPanel" class="edit-panel">

    <div class="edit-header">
        <h3>Edit Manager</h3>
        <button id="closeEdit">✕</button>
    </div>

    <div class="edit-tabs">
        <button class="edit-tab active" data-tab="add">Add</button>
        <button class="edit-tab" data-tab="update">Update</button>
        <button class="edit-tab" data-tab="delete">Delete</button>
    </div>

    <input
        type="search"
        id="editSearch"
        placeholder="Search Playlist / Title / Video ID..."
    >

    <div id="editList" class="edit-list">
        <!-- Dynamic content goes here -->
    </div>

</div>
    <div class="song-list-container">
      <ul id="sList" class="song-list"></ul>
    </div>

    <div class="ad-zone" id="adStage">
      ADVERTISEMENT PLACEHOLDER CONTAINER
    </div>
  
  </aside>
  
  <script src="./app.js" defer></script>

</body>
</html>
