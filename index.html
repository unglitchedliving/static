<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Stream PWA</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Video%20Stream%20PWA%22%2C%22short_name%22%3A%22VideoStream%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f6f8fa%22%2C%22theme_color%22%3A%22%230366d6%22%7D">
  <style>
    :root{--bg-color:#f6f8fa;--panel-bg:#ffffff;--border-color:#e1e4e8;--text-color:#24292e;--text-muted:#6a737d;--primary-color:#0366d6;--primary-hover:#f1f8ff;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background-color:var(--bg-color);color:var(--text-color);display:flex;flex-direction:column;height:100vh;overflow:hidden;}
    .main-content{width:100%;background:#000;flex-shrink:0;}
    .video-window{width:100%;}
    .video-container{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;}
    .video-container iframe{position:absolute;top:0;left:0;width:100%;height:100%;}
    .active-info{background:var(--panel-bg);padding:12px 16px;border-bottom:1px solid var(--border-color);}
    .active-info h1{font-size:16px;font-weight:600;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .active-info p{font-size:12px;color:var(--text-muted);}
    .empty-state{padding:20px;text-align:center;color:#fff;background:#1f2328;font-size:14px;}
    .sidebar{display:flex;flex-direction:column;flex-grow:1;overflow:hidden;background-color:var(--panel-bg);}
    .search-box{padding:12px 16px;border-bottom:1px solid var(--border-color);background-color:var(--panel-bg);}
    .search-box input{width:100%;padding:10px 14px;font-size:14px;border:1px solid var(--border-color);border-radius:6px;outline:none;background-color:var(--bg-color);}
    .search-box input:focus{border-color:var(--primary-color);background-color:#fff;box-shadow:0 0 0 3px rgba(3,102,214,0.2);}
    .playlist-tree{flex:1;overflow-y:auto;padding:8px 16px;}
    .playlist-group{border-bottom:1px solid var(--bg-color);}
    .playlist-header{display:flex;align-items:center;justify-content:between;padding:12px 4px;font-weight:600;font-size:14px;cursor:pointer;color:var(--text-color);}
    .collapse-icon{transition:transform 0.2s;font-size:10px;color:var(--text-muted);}
    .playlist-group.collapsed .collapse-icon{transform:rotate(-90deg);}
    .song-list{list-style:none;padding-left:8px;margin-bottom:8px;}
    .playlist-group.collapsed .song-list{display:none;}
    .song-item{padding:10px 12px;font-size:13px;cursor:pointer;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;color:var(--text-color);background-color:var(--bg-color);}
    .song-item:hover{background-color:var(--primary-hover);color:var(--primary-color);}
    .song-item.active{background-color:var(--primary-color);color:#fff;font-weight:500;}
    @media(min-width:768px){
      body{flex-direction:row;}
      .sidebar{width:320px;flex-grow:0;border-right:1px solid var(--border-color);}
      .main-content{flex:1;display:flex;align-items:center;justify-content:center;padding:40px;background-color:var(--bg-color);overflow-y:auto;}
      .video-window{max-width:900px;background:var(--panel-bg);border:1px solid var(--border-color);border-radius:8px;padding:24px;box-shadow:0 4px 12px rgba(27,31,35,0.05);}
      .video-container{border-radius:6px;}
      .active-info{padding:16px 0 0 0;border-bottom:none;}
      .active-info h1{font-size:20px;}
      .empty-state{background:transparent;color:var(--text-muted);}
    }
  </style>
</head>
<body>
  <main class="main-content" id="mainStage">
    <div class="empty-state"><h2>Select a video below to start watching</h2></div>
  </main>
  <aside class="sidebar">
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search title or playlist..."></div>
    <div id="playlistTree" class="playlist-tree"></div>
  </aside>
  <script>
    const videoData=[
      {"Id":"001","Playlist":"Featured Tutorials","Title":"Getting Started with YouTube Embeds","Video_id":"-Nbm1vFsr7Q"},
      {"Id":"002","Playlist":"Classic Hits","Title":"Rick Astley - Never Gonna Give You Up","Video_id":"dQw4w9WgXcQ"},
      {"Id":"003","Playlist":"Web Development Basics","Title":"HTML & CSS Crash Course for Beginners","Video_id":"2g811Eo7K8U"}
    ];
    let currentActiveId=null;
    function renderTree(filterText=''){
      const treeContainer=document.getElementById('playlistTree');
      treeContainer.innerHTML='';
      const query=filterText.toLowerCase().trim();
      const groups={};
      videoData.forEach(item=>{
        if(!query||item.Title.toLowerCase().includes(query)||item.Playlist.toLowerCase().includes(query)){
          if(!groups[item.Playlist])groups[item.Playlist]=[];
          groups[item.Playlist].push(item);
        }
      });
      Object.keys(groups).forEach(name=>{
        const groupEl=document.createElement('div');
        groupEl.className='playlist-group';
        const headerEl=document.createElement('div');
        headerEl.className='playlist-header';
        headerEl.innerHTML=`<span>${name}</span><span class="collapse-icon">▼</span>`;
        const listEl=document.createElement('ul');
        listEl.className='song-list';
        groups[name].forEach(video=>{
          const itemEl=document.createElement('li');
          itemEl.className=`song-item ${currentActiveId===video.Id?'active':''}`;
          itemEl.textContent=video.Title;
          itemEl.title=video.Title;
          itemEl.addEventListener('click',e=>{e.stopPropagation();loadVideo(video);});
          listEl.appendChild(itemEl);
        });
        headerEl.addEventListener('click',()=>groupEl.classList.toggle('collapsed'));
        groupEl.appendChild(headerEl);groupEl.appendChild(listEl);
        treeContainer.appendChild(groupEl);
      });
    }
    function loadVideo(video){
      currentActiveId=video.Id;
      document.querySelectorAll('.song-item').forEach(el=>el.classList.remove('active'));
      const target=Array.from(document.querySelectorAll('.song-item')).find(el=>el.textContent===video.Title);
      if(target)target.classList.add('active');
      document.getElementById('mainStage').innerHTML=`
        <div class="video-window">
          <div class="video-container">
            <iframe src="https://youtube.com/embed/${video.Video_id}?autoplay=1" title="${video.Title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="active-info"><h1>${video.Title}</h1><p>Playlist: <strong>${video.Playlist}</strong></p></div>
        </div>`;
    }
    document.getElementById('searchInput').addEventListener('input',e=>renderTree(e.target.value));
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>{
        const swBlob=new Blob([`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('fetch',e=>e.respondWith(fetch(e.request)));`],{type:'text/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
      });
    }
    renderTree();
  </script>
</body>
</html>
