<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My GitHub Pages Video Gallery</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: #f6f8fa;
      color: #24292e;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
      border-bottom: 1px solid #e1e4e8;
      padding-bottom: 16px;
    }

    header h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }

    header p {
      color: #586069;
      margin: 0;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
    }

    .video-card {
      background: #ffffff;
      border: 1px solid #e1e4e8;
      border-radius: 6px;
      padding: 16px;
      box-shadow: 0 1px 3px rgba(27,31,35,0.04);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .video-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(27,31,35,0.08);
    }

    .video-player-container {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 6px;
      background: #000;
      margin-bottom: 16px;
    }

    .video-player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .playlist-title {
      font-size: 12px;
      font-weight: 600;
      color: #6a737d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .video-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 12px 0;
      color: #0366d6;
    }

    .tags-container {
      margin-top: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      background-color: #f1f8ff;
      color: #0366d6;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 500;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Video Playlist Showcase</h1>
      <p>A beautifully curated, JSON-driven video showcase gallery.</p>
    </header>

    <div id="video-grid" class="video-grid"></div>
  </div>

  <script>
    // Lightweight JSON Data structure using the working sample video ID alongside others
    const videoData = [
      {
        "id": "-Nbm1vFsr7Q", 
        "playlist": "Featured Tutorials",
        "title": "Getting Started with YouTube Embeds",
        "tags": ["youtube", "embed", "iframe", "webdev"]
      },
      {
        "id": "dQw4w9WgXcQ", 
        "playlist": "Classic Hits",
        "title": "Rick Astley - Never Gonna Give You Up",
        "tags": ["music", "pop", "80s", "classic"]
      },
      {
        "id": "2g811Eo7K8U",
        "playlist": "Web Development Basics",
        "title": "HTML & CSS Crash Course for Beginners",
        "tags": ["html", "css", "webdev", "tutorial"]
      }
    ];

    const gridContainer = document.getElementById('video-grid');

    videoData.forEach(video => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const tagsHTML = video.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');

      // Using absolute backticks (`) to parse the template variables securely
      card.innerHTML = `
        <div class="video-player-container">
          <iframe 
            src="https://www.youtube.com/embed/${video.id}" 
            title="${video.title}" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="playlist-title">${video.playlist}</div>
        <h2 class="video-title">${video.title}</h2>
        <div class="tags-container">
          ${tagsHTML}
        </div>
      `;

      gridContainer.appendChild(card);
    });
  </script>

</body>
</html>
