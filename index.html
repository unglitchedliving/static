
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="theme-color" content="#0d1117">
  <meta name="description" content="Lightweight YouTube playlist player">

  <title>Video Stream PWA</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">

  <style>
    :root {
      color-scheme: dark;
      --bg-color: #0d1117;
      --panel-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --text-muted: #8b949e;
      --primary-color: #58a6ff;
      --primary-hover: #1f2937;
      --card-active: #1f6feb;
      --danger-color: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    .main-content {
      width: 100%;
      background: #000;
      flex-shrink: 0;
    }

    .video-window {
      width: 100%;
    }

    .video-container {
      position: relative;
      aspect-ratio: 16 / 9;
      width: 100%;
      overflow: hidden;
      background: #000;
    }

    .video-container iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .active-info {
      background: var(--panel-bg);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .active-info h1 {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f0f6fc;
    }

    .active-info p {
      font-size: 12px;
      color: var(--text-muted);
    }

    .active-info strong {
      color: var(--primary-color);
    }

    .empty-state {
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      background: var(--panel-bg);
    }

    .controls-wrapper {
      padding: 14px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .controls-wrapper select,
    .controls-wrapper input {
      width: 100%;
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: var(--bg-color);
      color: #f0f6fc;
    }

    .controls-wrapper :focus-visible,
    button:focus-visible,
    .song-item:focus-visible {
      outline: 2px solid var(--primary-color);
      outline-offset: 2px;
    }

    .options-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 4px;
    }

    .loop-label {
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      user-select: none;
    }

    .btn-clear {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--danger-color);
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .song-list-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 14px;
      overscroll-behavior: contain;
    }

    .song-list {
      list-style: none;
    }

    .song-item {
      padding: 10px;
      font-size: 13px;
      cursor: pointer;
      border-radius: 6px;
      margin-bottom: 6px;
      background: var(--bg-color);
      border: 1px solid transparent;
      display: flex;
      flex-direction: column;
      transition: background-color .15s, border-color .15s;
    }

    .song-item-title {
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f0f6fc;
    }

    .song-item-meta {
      font-size: 11px;
      color: var(--text-muted);
    }

    .song-item:hover {
      background: var(--primary-hover);
      border-color: var(--border-color);
    }

    .song-item.active {
      background: var(--card-active);
      border-color: var(--primary-color);
    }

    .ad-zone {
      width: 100%;
      min-height: 60px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 11px;
    }

    @media (min-width: 768px),
           (orientation: landscape) and (max-height: 500px) {

      body {
        flex-direction: row;
      }

      .sidebar {
        width: 280px;
        flex: 0 0 280px;
        border-right: 1px solid var(--border-color);
      }

      .main-content {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        overflow-y: auto;
      }

      .video-window {
        width: 100%;
        max-width: 850px;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
      }

      .video-container {
        border-radius: 6px;
      }

      .active-info {
        padding: 12px 0 0;
        border: 0;
        background: transparent;
      }

      .empty-state {
        background: transparent;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="main-content" id="mainStage">
    <div class="empty-state">
      <h2>Select a video below to start watching</h2>
    </div>
  </main>

  <aside class="sidebar">

    <div class="controls-wrapper">

      <select id="plFilter" aria-label="Filter playlists">
        <option value="">All Playlists</option>
      </select>

      <input
        type="search"
        id="sInput"
        placeholder="Search title..."
        aria-label="Search videos"
      >

      <div class="options-row">

        <label class="loop-label">
          <input type="checkbox" id="lToggle">
          Loop Video
        </label>

        <button class="btn-clear" id="cHistory" type="button">
          Clear History
        </button>

      </div>
    </div>

    <div class="song-list-container">
      <ul id="sList" class="song-list"></ul>
    </div>

    <div class="ad-zone" id="adStage">
      ADVERTISEMENT PLACEHOLDER CONTAINER
    </div>

  </aside>

  <script>
    "use strict";

    const data = [
      {
        Id: "001",
        Playlist: "Featured Tutorials",
        Title: "Getting Started with YouTube Embeds",
        Video_id: "-Nbm1vFsr7Q"
      },
      {
        Id: "002",
        Playlist: "Classic Hits",
        Title: "Rick Astley - Never Gonna Give You Up",
        Video_id: "dQw4w9WgXcQ"
      },
      {
        Id: "003",
        Playlist: "Web Development Basics",
        Title: "HTML & CSS Crash Course for Beginners",
        Video_id: "2g811Eo7K8U"
      }
    ];

    const STORAGE = {
      video: "pwa_vid",
      loop: "pwa_loop"
    };

    const $ = id => document.getElementById(id);

    const elements = {
      main: $("mainStage"),
      playlist: $("plFilter"),
      search: $("sInput"),
      loop: $("lToggle"),
      history: $("cHistory"),
      list: $("sList")
    };

    let activeId = null;

    // Initialize playlist options
    function init() {
      const playlists = [...new Set(data.map(v => v.Playlist))];

      const fragment = document.createDocumentFragment();

      playlists.forEach(playlist => {
        const option = document.createElement("option");
        option.value = playlist;
        option.textContent = playlist;
        fragment.appendChild(option);
      });

      elements.playlist.appendChild(fragment);

      elements.loop.checked =
        localStorage.getItem(STORAGE.loop) === "true";

      render();

      const savedVideo = data.find(
        v => v.Id === localStorage.getItem(STORAGE.video)
      );

      if (savedVideo) {
        load(savedVideo, false);
      }
    }

    // Render filtered playlist
    function render() {
      const playlist = elements.playlist.value;
      const query = elements.search.value.trim().toLowerCase();

      const fragment = document.createDocumentFragment();

      const filtered = data.filter(video =>
        (!playlist || video.Playlist === playlist) &&
        (!query || video.Title.toLowerCase().includes(query))
      );

      filtered.forEach(video => {
        const li = document.createElement("li");

        li.className =
          "song-item" +
          (activeId === video.Id ? " active" : "");

        li.tabIndex = 0;
        li.setAttribute("role", "button");
        li.setAttribute("aria-pressed", String(activeId === video.Id));

        const title = document.createElement("span");
        title.className = "song-item-title";
        title.textContent = video.Title;

        const meta = document.createElement("span");
        meta.className = "song-item-meta";
        meta.textContent = video.Playlist;

        li.append(title, meta);

        li.addEventListener("click", () => load(video, true));

        li.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            load(video, true);
          }
        });

        fragment.appendChild(li);
      });

      elements.list.replaceChildren(fragment);
    }

    // Load YouTube video
    function load(video, autoplay = false) {
      activeId = video.Id;

      localStorage.setItem(STORAGE.video, video.Id);

      render();

      const params = new URLSearchParams({
        rel: "0"
      });

      if (autoplay) {
        params.set("autoplay", "1");
      }

      if (elements.loop.checked) {
        params.set("loop", "1");
        params.set("playlist", video.Video_id);
      }

      const iframe = document.createElement("iframe");

      iframe.src =
        `https://www.youtube-nocookie.com/embed/` +
        `${encodeURIComponent(video.Video_id)}?${params}`;

      iframe.title = video.Title;

      iframe.allow =
        "autoplay; encrypted-media; picture-in-picture; fullscreen";

      iframe.allowFullscreen = true;

      iframe.referrerPolicy =
        "strict-origin-when-cross-origin";

      const videoContainer = document.createElement("div");
      videoContainer.className = "video-container";

      videoContainer.appendChild(iframe);

      const info = document.createElement("div");
      info.className = "active-info";

      const heading = document.createElement("h1");
      heading.textContent = video.Title;

      const description = document.createElement("p");
      description.append("Playlist: ");

      const playlistName = document.createElement("strong");
      playlistName.textContent = video.Playlist;

      description.appendChild(playlistName);

      info.append(heading, description);

      const windowElement = document.createElement("div");
      windowElement.className = "video-window";

      windowElement.append(videoContainer, info);

      elements.main.replaceChildren(windowElement);
    }

    // Playlist filter
    elements.playlist.addEventListener("change", render);

    // Search
    elements.search.addEventListener("input", render);

    // Loop toggle
    elements.loop.addEventListener("change", () => {
      localStorage.setItem(
        STORAGE.loop,
        String(elements.loop.checked)
      );

      const current = data.find(v => v.Id === activeId);

      if (current) {
        load(current, false);
      }
    });

    // Clear player history only
    elements.history.addEventListener("click", () => {
      localStorage.removeItem(STORAGE.video);
      localStorage.removeItem(STORAGE.loop);

      elements.loop.checked = false;

      activeId = null;

      render();

      const empty = document.createElement("div");
      empty.className = "empty-state";

      const heading = document.createElement("h2");
      heading.textContent = "Select a video below to start watching";

      empty.appendChild(heading);

      elements.main.replaceChildren(empty);
    });

    // Register PWA service worker
    async function registerServiceWorker() {
      if (!("serviceWorker" in navigator)) return;

      try {
        await navigator.serviceWorker.register(
          "./service-worker.js"
        );
      } catch {
        // Registration failure should not interrupt playback.
      }
    }

    init();
    registerServiceWorker();

  </script>

</body>
</html>
